<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daily Calorie Calculator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <section class="card">
        <h1>Daily Calorie Requirement Calculator</h1>
        <p class="subtitle">Estimate BMR and maintenance calories for your clients.</p>

        <form id="calorie-form" novalidate>
          <div class="grid">
            <label>
              Full name
              <input id="name" type="text" minlength="2" placeholder="e.g. Jane Doe" required />
            </label>

            <label>
              Email
              <input id="email" type="email" placeholder="e.g. jane@email.com" required />
            </label>

            <label>
              Sex
              <select id="sex" required>
                <option value="">Select sex</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
              </select>
            </label>

            <label>
              Age (years)
              <input id="age" type="number" min="10" max="100" placeholder="e.g. 30" required />
            </label>

            <label>
              Weight
              <div class="inline">
                <input id="weight" type="number" min="1" step="0.1" placeholder="e.g. 80" required />
                <select id="weight-unit">
                  <option value="kg">kg</option>
                  <option value="lb">lb</option>
                </select>
              </div>
            </label>

            <label>
              Height
              <div class="inline">
                <input id="height" type="number" min="1" step="0.1" placeholder="e.g. 180" required />
                <select id="height-unit">
                  <option value="cm">cm</option>
                  <option value="in">in</option>
                </select>
              </div>
            </label>

            <label>
              Activity level
              <select id="activity" required>
                <option value="">Select activity</option>
                <option value="sedentary">Sedentary (little/no exercise)</option>
                <option value="light">Light (1–3 days/week)</option>
                <option value="moderate">Moderate (3–5 days/week)</option>
                <option value="active">Active (6–7 days/week)</option>
                <option value="very_active">Very active (physical job + training)</option>
              </select>
            </label>

            <label>
              Goal
              <select id="goal">
                <option value="maintain">Maintain weight</option>
                <option value="cut">Fat loss (cut)</option>
                <option value="bulk">Muscle gain (bulk)</option>
              </select>
            </label>
          </div>

          <p class="hint">Results are shown after you submit your name and email.</p>
          <p id="error" class="error" aria-live="polite"></p>
          <button type="submit">Submit & See Results</button>
        </form>

        <section id="results" class="results hidden" aria-live="polite">
          <h2>Results</h2>
          <p><strong>BMR:</strong> <span id="bmr-value">-</span> kcal/day</p>
          <p><strong>Maintenance calories (TDEE):</strong> <span id="tdee-value">-</span> kcal/day</p>
          <p><strong>Goal target:</strong> <span id="goal-value">-</span> kcal/day</p>
        </section>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
